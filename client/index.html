<!doctype html>
<html lang="en" data-theme="nocturne" data-style="framed" data-diff-theme="nocturne" data-code-font="jetbrains-mono">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <script>
      // Apply the persisted themes before first paint to avoid a flash. Keys mirror src/theme/useTheme.ts.
      ;(function () {
        var pick = function (key, allowed, fallback) {
          var stored = localStorage.getItem(key)
          return allowed.indexOf(stored) >= 0 ? stored : fallback
        }
        var root = document.documentElement
        root.setAttribute('data-theme', pick('review.theme', ['nocturne', 'ember', 'slate', 'atelier', 'darkula', 'neon', 'daylight'], 'nocturne'))
        root.setAttribute('data-style', pick('review.styleMode', ['framed', 'tonal'], 'framed'))
        root.setAttribute('data-diff-theme', pick('review.diffTheme', ['github', 'nocturne', 'muted', 'vivid', 'paper', 'darkula', 'neon', 'solar', 'acid'], 'nocturne'))
        root.setAttribute('data-code-font', pick('review.codeFont', ['jetbrains-mono', 'ibm-plex-mono', 'fira-code', 'source-code-pro'], 'jetbrains-mono'))
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
