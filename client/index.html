<!doctype html>
<html lang="en" data-theme="nocturne" data-diff-theme="nocturne">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Review</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0d12" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the persisted themes before first paint to avoid a flash. Keys mirror src/theme/useTheme.ts.
      ;(function () {
        var pick = function (key, allowed, fallback) {
          var stored = localStorage.getItem(key)
          return allowed.indexOf(stored) >= 0 ? stored : fallback
        }
        var root = document.documentElement
        root.setAttribute('data-theme', pick('review.theme', ['nocturne', 'ember', 'slate'], 'nocturne'))
        root.setAttribute('data-diff-theme', pick('review.diffTheme', ['nocturne', 'muted', 'vivid', 'paper'], 'nocturne'))
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
